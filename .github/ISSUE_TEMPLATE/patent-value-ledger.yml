name: Propose a patent-value ledger
description: Propose a public-source patent value ledger or evidence update
title: "[Ledger] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please provide evidence, not a score. Unknown is acceptable.
  - type: input
    id: patent
    attributes:
      label: Patent/application number
      placeholder: ZL...
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Patent title
    validations:
      required: true
  - type: textarea
    id: carrier
    attributes:
      label: Proposed value carrier
      description: Product, process, platform, drug, equipment, project, standard, etc.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: Include source URLs, dates, and what each source actually proves.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Proposed realization stage
      options:
        - R0
        - R1
        - R2
        - R3
        - R4
        - R5
        - Unknown
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: What remains unknown?
      description: Please explicitly state attribution or observability gaps.
