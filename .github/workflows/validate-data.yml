name: Validate benchmark data

on:
  push:
    paths:
      - "data/**"
      - "reports/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "reports/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          import sys
          import jsonschema
          print(f"python={sys.executable}")
          print(f"version={sys.version.split()[0]}")
          print(f"jsonschema={jsonschema.__version__}")
          PY

      - name: Compile tools and tests (syntax boundary)
        run: |
          # Dynamic compileall: new tools/*.py are covered without editing this list.
          python -m compileall -q tools tests
          echo "compileall OK: tools/ + tests/"

      - name: Validate JSONL data (formal schema 1.0)
        run: |
          if ! python tools/validate_data.py; then
            echo "::error title=validate_data failed::Local tip: create/activate .venv and pip install -r requirements-dev.txt — see docs/getting-started.md §1"
            exit 1
          fi

      - name: Run unit tests (includes cold-start levers)
        run: |
          # Single discover keeps cold-start + experimental tests in CI without per-file steps.
          if ! python -m unittest discover -s tests -p 'test_*.py' -v; then
            echo "::error title=unit tests failed::Includes test_coldstart_levers.py — fix consistency levers before raising R-stage. Local: .venv/bin/python -m unittest discover -s tests -v"
            exit 1
          fi

      - name: Validate experimental Rights Control
        run: |
          if ! python tools/validate_rights_control.py; then
            echo "::error title=Rights Control validation failed::Experimental only (schema/experimental). Formal Ledger stays schema 1.0 / V0.7."
            exit 1
          fi

      - name: Validate experimental Realization Path
        run: |
          if ! python tools/validate_realization_paths.py; then
            echo "::error title=Realization Path validation failed::Experimental only (schema/experimental). Formal Ledger stays schema 1.0 / V0.7."
            exit 1
          fi

      - name: Check Realization Path snapshots
        run: python tools/project_realization_paths.py --check

      - name: Check generated diagnostics
        run: python tools/generate_diagnostics.py --check

      - name: Check generated Markdown reports
        run: python tools/render_reports.py --check
