name: Validate benchmark data

on:
  push:
    paths:
      - "data/**"
      - "reports/**"
      - "schema/**"
      - "tools/validate_data.py"
      - "tools/generate_diagnostics.py"
      - "tools/render_reports.py"
      - "tools/scaffold_ledger.py"
      - "tools/validate_rights_control.py"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "reports/**"
      - "schema/**"
      - "tools/validate_data.py"
      - "tools/generate_diagnostics.py"
      - "tools/render_reports.py"
      - "tools/validate_rights_control.py"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python tools
        run: python -m py_compile tools/validate_data.py tools/generate_diagnostics.py tools/render_reports.py tools/scaffold_ledger.py tools/validate_rights_control.py

      - name: Validate JSONL data
        run: python tools/validate_data.py

      - name: Validate experimental Rights Control
        run: python tools/validate_rights_control.py

      - name: Test experimental Rights Control
        run: python -m unittest discover -s tests -p "test_rights_control.py"

      - name: Check generated diagnostics
        run: python tools/generate_diagnostics.py --check

      - name: Check generated Markdown reports
        run: python tools/render_reports.py --check
